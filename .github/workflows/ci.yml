name: Validate portable skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.8', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill metadata and resource links
        run: python tools/validate_skills.py
      - name: Check Python syntax
        run: python -m compileall -q skills tools benchmarks install.py
      - name: Run isolated integration tests
        run: python -m unittest discover -s tests -q
      - name: Reproduce content-size benchmark
        run: python benchmarks/benchmark.py
